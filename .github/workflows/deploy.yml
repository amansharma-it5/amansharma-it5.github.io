name: Build and deploy portfolio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Check Astro types
        run: npm run check
      - name: Build static site
        run: npm run build
      - name: Install Chromium, Firefox and WebKit for browser tests
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Test browser behavior and accessibility
        run: npm run test:browser
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-browser-qa
          path: |
            artifacts/qa/reports/
            test-results/
          if-no-files-found: ignore
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
